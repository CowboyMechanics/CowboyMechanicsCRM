<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Soft gray-blue background that stays back; bright frosted cards that stand out;
       see-through "jelly" sky blue for actions, jelly red for anything urgent. */
    :root {
      color-scheme: light;
      --bg: #e3e8f0;
      --card: rgba(255,255,255,.9); --card-line: #ffffff; --inner: #f3f7fc; --inner-line: #e3ebf5;
      --shadow: 0 12px 34px rgba(52,72,104,.12), 0 2px 6px rgba(52,72,104,.05);
      --text: #1b2433; --muted: #5d6879; --line: #e6ecf3;
      --sky: #7cc0f2; --sky-deep: #2f86c9; --sky-text: #0f4a78;
      --brand: #c66a06;
      --t-blue-bg: rgba(160,210,248,.45); --t-blue: #0f4a78; --t-blue-line: rgba(124,192,242,.7);
      --t-lav-bg: rgba(200,196,250,.45); --t-lav: #463f99; --t-lav-line: rgba(170,164,240,.7);
      --t-mint-bg: rgba(160,226,196,.45); --t-mint: #1b6644; --t-mint-line: rgba(120,206,166,.7);
      --t-peach-bg: rgba(252,205,166,.5); --t-peach: #8a420d; --t-peach-line: rgba(244,176,120,.7);
      --t-pink-bg: rgba(246,190,220,.45); --t-pink: #87305f; --t-pink-line: rgba(236,156,198,.7);
      --t-red-bg: rgba(255,170,166,.42); --t-red: #a3201a; --t-red-line: rgba(240,120,114,.65);
      --t-gray-bg: rgba(210,218,228,.5); --t-gray: #4f5b6b; --t-gray-line: rgba(190,200,214,.8);
      --font: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
      /* jelly: tinted see-through fill, bright rim, top shine, soft colored glow */
      --jelly-shine: inset 0 1.5px 0 rgba(255,255,255,.95), inset 0 -4px 10px rgba(255,255,255,.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    html { background: var(--bg); }
    body { font-family: var(--font); font-size: 15px; line-height: 1.5; color: var(--text); min-height: 100vh;
      background: linear-gradient(180deg, #e9edf3 0%, #dfe6ef 100%) fixed; }
    h1 { font-size: 28px; line-height: 1.15; font-weight: 700; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
    h2 { font-size: 17px; font-weight: 700; margin: 0; }
    a { color: var(--sky-text); }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .num { font-variant-numeric: tabular-nums; }
    .pre { white-space: pre-wrap; word-break: break-word; }
    svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    .glass { background: var(--card); -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%);
      border: 1px solid var(--card-line); border-radius: 26px; box-shadow: inset 0 1px 0 #fff, var(--shadow); }

    /* ---------- layout ---------- */
    .shell { display: flex; min-height: 100vh; gap: 4px; }
    .side { position: sticky; top: 16px; height: calc(100vh - 32px); width: 244px; flex-shrink: 0; margin: 16px 0 16px 16px;
      padding: 22px 16px; display: flex; flex-direction: column; gap: 22px; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; cursor: pointer; }
    .brand img { height: 44px; width: 44px; object-fit: contain; padding: 5px; border-radius: 14px; background: #211f1d; box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 4px 12px rgba(33,31,29,.25); }
    .brand b { display: block; font-weight: 800; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; line-height: 1.15; }
    .brand small { color: var(--brand); font-weight: 700; font-size: 12px; }
    .side nav { display: flex; flex-direction: column; gap: 4px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 999px; border: 1px solid transparent;
      background: none; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; text-align: left; }
    .nav-item:hover { color: var(--text); background: var(--inner); }
    .nav-item.on { color: var(--sky-text); background: linear-gradient(180deg, rgba(190,226,252,.75), rgba(140,198,244,.5)); border-color: rgba(255,255,255,.95);
      box-shadow: var(--jelly-shine), 0 4px 14px rgba(124,192,242,.35); }
    .nav-item .count { margin-left: auto; min-width: 22px; padding: 0 7px; border-radius: 11px; font-size: 12px; text-align: center; color: var(--t-red);
      background: var(--t-red-bg); border: 1px solid var(--t-red-line); box-shadow: inset 0 1px 0 rgba(255,255,255,.8); }
    main { flex: 1; min-width: 0; padding: 28px 28px 60px; display: flex; flex-direction: column; gap: 20px; max-width: 1240px; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
    .mobile-head { display: none; }
    .tabbar { display: none; }
    @media (max-width: 860px) {
      .side { display: none; }
      main { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 120px max(16px, env(safe-area-inset-left, 0px)); }
      .mobile-head { display: flex; align-items: center; justify-content: space-between; }
      .tabbar { display: flex; position: fixed; z-index: 40; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        justify-content: space-around; align-items: center; padding: 6px; border-radius: 999px; }
      .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; font: inherit; font-size: 11px; font-weight: 600;
        color: var(--muted); padding: 6px 8px; cursor: pointer; border-radius: 999px; min-width: 56px; position: relative; }
      .tab.on { color: var(--sky-text); }
      .tab .dot { position: absolute; top: 2px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: #e2483f; box-shadow: 0 0 0 2px #fff; }
      .tab.plus { width: 56px; height: 56px; min-width: 0; border-radius: 50%; justify-content: center; color: var(--sky-text); margin-top: -28px;
        background: linear-gradient(180deg, rgba(196,230,253,.98) 0%, rgba(124,192,242,.92) 100%); border: 1px solid rgba(255,255,255,.95);
        box-shadow: var(--jelly-shine), 0 8px 22px rgba(80,160,225,.5); }
      .tab.plus svg.i { width: 26px; height: 26px; stroke-width: 2.4; }
      h1 { font-size: 24px; }
    }

    .cols { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; align-items: start; }
    .stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
    @media (max-width: 1000px) {
      .cols { grid-template-columns: 1fr; }
      .home-cols { display: flex; flex-direction: column; }
      .home-cols > .stack { display: contents; }
    }
    .o1 { order: 1; } .o2 { order: 2; } .o3 { order: 3; } .o4 { order: 4; } .o5 { order: 5; }
    .card { padding: 20px; min-width: 0; }
    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    .card-head .left { display: flex; align-items: center; gap: 10px; }
    .badge-icon { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; padding: 0 !important; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .spread { justify-content: space-between; }
    .empty { color: var(--muted); padding: 10px 2px; }

    /* ---------- buttons, tags, inputs ---------- */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 18px; border-radius: 999px; font: inherit; font-weight: 600; font-size: 14px;
      cursor: pointer; text-decoration: none; white-space: nowrap; color: var(--text);
      background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(240,245,251,.8)); border: 1px solid #fff;
      box-shadow: var(--jelly-shine), 0 0 0 1px rgba(196,208,222,.55), 0 4px 12px rgba(52,72,104,.1); }
    .btn:hover { background: #fff; }
    .btn.primary { color: var(--sky-text);
      background: linear-gradient(180deg, rgba(200,232,254,.98) 0%, rgba(138,200,246,.9) 100%); border-color: rgba(255,255,255,.95);
      box-shadow: var(--jelly-shine), 0 0 0 1px rgba(124,192,242,.55), 0 6px 18px rgba(80,160,225,.4); }
    .btn.primary:hover { filter: brightness(1.04) saturate(1.1); }
    .btn.big { padding: 14px 22px; font-size: 15px; width: 100%; }
    .btn.sm { padding: 6px 12px; font-size: 13px; }
    .btn.danger { color: var(--t-red); background: linear-gradient(180deg, rgba(255,226,224,.95), rgba(255,190,186,.6)); box-shadow: var(--jelly-shine), 0 0 0 1px var(--t-red-line), 0 4px 12px rgba(226,72,63,.18); }
    .btn:focus-visible, .nav-item:focus-visible, .check:focus-visible, .tab:focus-visible, .linkbtn:focus-visible, .day:focus-visible { outline: 2px solid var(--sky-deep); outline-offset: 2px; }
    .round { width: 46px; height: 46px; padding: 0; border-radius: 50%; }
    .action { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--muted); background: none; border: 0; cursor: pointer; text-decoration: none; font-family: inherit; }
    .action .btn { color: var(--sky-text); }
    .linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--sky-text); font-weight: 600; cursor: pointer; text-align: left; }
    .linkbtn:hover { text-decoration: underline; }

    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
      border: 1px solid; box-shadow: inset 0 1px 0 rgba(255,255,255,.85); }
    .tag.blue { background: var(--t-blue-bg); color: var(--t-blue); border-color: var(--t-blue-line); }
    .tag.lav { background: var(--t-lav-bg); color: var(--t-lav); border-color: var(--t-lav-line); }
    .tag.mint { background: var(--t-mint-bg); color: var(--t-mint); border-color: var(--t-mint-line); }
    .tag.peach { background: var(--t-peach-bg); color: var(--t-peach); border-color: var(--t-peach-line); }
    .tag.pink { background: var(--t-pink-bg); color: var(--t-pink); border-color: var(--t-pink-line); }
    .tag.red { background: var(--t-red-bg); color: var(--t-red); border-color: var(--t-red-line); }
    .tag.gray { background: var(--t-gray-bg); color: var(--t-gray); border-color: var(--t-gray-line); }
    .badge-icon.tag { box-shadow: inset 0 2px 3px rgba(255,255,255,.9), inset 0 -3px 6px rgba(255,255,255,.3), 0 4px 10px rgba(52,72,104,.12); }

    input, select, textarea { width: 100%; font: inherit; color: var(--text); padding: 11px 16px; border-radius: 16px;
      background: var(--inner); border: 1px solid var(--inner-line); box-shadow: inset 0 1px 3px rgba(52,72,104,.06); }
    input:focus, select:focus, textarea:focus { outline: none; background: #fff; border-color: var(--sky); box-shadow: 0 0 0 4px rgba(124,192,242,.3); }
    textarea { min-height: 84px; resize: vertical; border-radius: 18px; }
    label.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }
    label.f .req { color: var(--t-red); }
    .hint { font-size: 13px; color: var(--muted); font-weight: 400; }
    .form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form .full { grid-column: 1 / -1; }
    .form .section-title { grid-column: 1 / -1; margin-top: 6px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    @media (max-width: 560px) { .form { grid-template-columns: 1fr; } }
    .pillcheck { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-radius: 999px; background: var(--inner); border: 1px solid var(--inner-line); font-weight: 500; cursor: pointer; }
    .pillcheck input { width: 20px; height: 20px; accent-color: var(--sky-deep); margin: 0; }
    .switch { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 0; border-top: 1px solid var(--line); font-weight: 500; }
    .switch:first-child { border-top: 0; }
    .switch input { appearance: none; -webkit-appearance: none; width: 52px; height: 30px; border-radius: 999px; padding: 0; flex-shrink: 0; cursor: pointer; position: relative;
      background: #dfe6ef; border: 1px solid #fff; box-shadow: inset 0 1px 3px rgba(52,72,104,.18); transition: background .2s; }
    .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff, #eef3f8); box-shadow: 0 2px 6px rgba(52,72,104,.3); transition: left .2s; }
    .switch input:checked { background: linear-gradient(180deg, rgba(200,232,254,.98), rgba(110,184,240,.95)); box-shadow: var(--jelly-shine), 0 3px 10px rgba(80,160,225,.4); }
    .switch input:checked::after { left: 24px; }

    /* ---------- to-do list ---------- */
    .todo { display: flex; flex-direction: column; gap: 10px; }
    .titem { display: flex; gap: 12px; align-items: flex-start; padding: 13px 14px; border-radius: 20px; background: var(--inner); border: 1px solid var(--inner-line); transition: opacity .3s; }
    .titem.overdue { background: linear-gradient(180deg, rgba(255,232,230,.95), rgba(255,206,202,.6)); border-color: var(--t-red-line);
      box-shadow: inset 0 1.5px 0 rgba(255,255,255,.95), 0 4px 14px rgba(226,72,63,.14); }
    .titem.leaving { opacity: .35; }
    .titem.leaving .tt { text-decoration: line-through; }
    .titem .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .tt { font-weight: 700; }
    .check { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; cursor: pointer; display: grid; place-items: center; padding: 0; margin-top: 1px; color: transparent;
      background: radial-gradient(circle at 35% 30%, #fff 0%, rgba(255,255,255,.85) 45%, rgba(210,226,242,.8) 100%); border: 1.5px solid rgba(140,166,194,.7);
      box-shadow: inset 0 1px 2px #fff, 0 2px 6px rgba(52,72,104,.15); }
    .check:hover { border-color: #5fb58c; color: #9ccfb6; }
    .check.on { background: linear-gradient(180deg, #b6ebd2, #62bb92); border-color: #fff; color: #fff; box-shadow: inset 0 1.5px 0 rgba(255,255,255,.8), 0 3px 10px rgba(80,180,130,.45); }
    .check svg.i { width: 16px; height: 16px; stroke-width: 2.6; }
    .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }

    .appt { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 18px; cursor: pointer; background: var(--inner); border: 1px solid var(--inner-line); width: 100%; font: inherit; color: inherit; text-align: left; }
    .appt:hover { background: #eaf3fd; border-color: rgba(124,192,242,.5); }
    .appt .time { min-width: 70px; font-weight: 700; color: var(--sky-text); font-variant-numeric: tabular-nums; }
    .appt .grow { flex: 1; min-width: 0; }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .daylabel { font-size: 13px; font-weight: 700; color: var(--muted); margin: 8px 2px 0; }
    .daylabel:first-child { margin-top: 0; }
    .mk { display: flex; align-items: center; gap: 10px; padding: 6px 2px; }
    .mk.done span { text-decoration: line-through; color: var(--muted); }
    .mk .check { width: 24px; height: 24px; }
    .mk .x { margin-left: auto; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 4px; }

    /* ---------- calendar ---------- */
    .cal-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .cal-head h2 { font-size: 22px; min-width: 170px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
    .dow { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); padding: 2px 0; }
    .day { min-height: 108px; padding: 8px; border-radius: 16px; background: var(--inner); border: 1px solid var(--inner-line); cursor: pointer;
      display: flex; flex-direction: column; gap: 4px; min-width: 0; font: inherit; color: inherit; text-align: left; }
    .day:hover { background: #eaf3fd; }
    .day.out { opacity: .45; }
    .day.sel { border-color: var(--sky); box-shadow: 0 0 0 3px rgba(124,192,242,.3); background: #fff; }
    .day .n { font-weight: 700; font-size: 14px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; }
    .day.today .n { color: var(--sky-text); background: linear-gradient(180deg, rgba(200,232,254,.98), rgba(124,192,242,.9)); box-shadow: var(--jelly-shine), 0 3px 8px rgba(80,160,225,.45); }
    .chip { display: block; width: 100%; font-size: 12px; font-weight: 600; padding: 3px 7px; border-radius: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-align: left; cursor: pointer; font-family: inherit; background: var(--t-blue-bg); color: var(--t-blue); border: 1px solid var(--t-blue-line); box-shadow: inset 0 1px 0 rgba(255,255,255,.8); }
    .chip.done { background: var(--t-mint-bg); color: var(--t-mint); border-color: var(--t-mint-line); }
    .chip.late { background: var(--t-red-bg); color: var(--t-red); border-color: var(--t-red-line); }
    .more { font-size: 12px; color: var(--muted); font-weight: 600; padding-left: 4px; }
    .dots { display: none; gap: 3px; }
    .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--sky-deep); }
    @media (max-width: 700px) {
      .cal-grid { gap: 4px; }
      .day { min-height: 54px; padding: 5px; align-items: center; border-radius: 12px; }
      .day .chip, .day .more { display: none; }
      .dots { display: flex; }
    }

    /* ---------- clients ---------- */
    .client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .ccard { padding: 16px 18px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; text-align: left; font: inherit; color: inherit; }
    .ccard:hover { box-shadow: inset 0 1px 0 #fff, 0 0 0 2px rgba(124,192,242,.45), var(--shadow); }
    .detail { display: flex; flex-direction: column; }
    .drow { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-top: 1px solid var(--line); }
    .drow:first-child { border-top: 0; padding-top: 2px; }
    .drow .k { font-size: 12px; color: var(--muted); }
    .drow .v { word-break: break-word; }
    .drow svg.i { margin-top: 3px; color: var(--sky-deep); }
    .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
    .photos button { aspect-ratio: 1; max-width: 100%; border-radius: 14px; overflow: hidden; padding: 0; border: 1px solid #fff; cursor: pointer; background: var(--inner); box-shadow: 0 3px 10px rgba(52,72,104,.12); }
    .photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .visit { padding: 14px; border-radius: 20px; background: var(--inner); border: 1px solid var(--inner-line); display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
    .visit:hover { background: #eaf3fd; }
    .kv { display: grid; grid-template-columns: 130px 1fr; gap: 4px 12px; font-size: 14px; }
    .kv .k { color: var(--muted); }
    @media (max-width: 560px) { .kv { grid-template-columns: 1fr; } .kv .k { margin-top: 4px; } }

    /* ---------- modal, toast ---------- */
    .modal-wrap { position: fixed; inset: 0; z-index: 60; background: rgba(30,44,66,.3); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      display: flex; align-items: flex-start; justify-content: center; padding: 28px 16px; overflow-y: auto; }
    .modal { width: 100%; max-width: 640px; padding: 24px; border-radius: 28px; background: rgba(255,255,255,.96); }
    .modal h2 { font-size: 20px; margin-bottom: 16px; }
    .modal .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
    .modal .actions .grow { flex: 1; }
    .lightbox img { width: 100%; border-radius: 18px; display: block; background: var(--inner); min-height: 120px; }
    #toast { position: fixed; z-index: 80; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 12px 20px; border-radius: 999px;
      background: rgba(20,40,64,.92); color: #fff; font-weight: 600; display: none; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
    #toast.err { background: #c0332b; }
    @media (min-width: 861px) { #toast { bottom: 28px; } }
    #busy { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 90; display: none;
      background: linear-gradient(90deg, transparent, var(--sky-deep), transparent); background-size: 40% 100%; background-repeat: no-repeat; animation: slide 1s linear infinite; }
    @keyframes slide { from { background-position: -40% 0; } to { background-position: 140% 0; } }
    @media (prefers-reduced-motion: reduce) { #busy { animation: none; background: var(--sky-deep); } .titem, .switch input, .switch input::after { transition: none; } }

    /* ================= LIQUID GLASS =================
       Clear centers, thick bright rims with a slight rainbow edge, a wet shine on top,
       and a colored glow underneath. Tint per element comes from --tint (r,g,b). */
    body { background:
        radial-gradient(520px 380px at 12% 18%, rgba(150,205,250,.55), transparent 70%),
        radial-gradient(600px 420px at 88% 80%, rgba(140,195,245,.45), transparent 70%),
        radial-gradient(420px 300px at 70% 12%, rgba(255,255,255,.95), transparent 70%),
        radial-gradient(380px 300px at 30% 92%, rgba(180,225,240,.5), transparent 70%),
        linear-gradient(180deg, #e8edf3 0%, #dde4ed 100%) !important; background-attachment: fixed !important; }

    .glass, .titem, .appt, .day, .visit, .btn, .tag, .chip, .check, .nav-item.on, .tab.plus, .badge-icon,
    input, select, textarea, .pillcheck, .switch input, .nav-item .count, .day.today .n {
      position: relative; isolation: isolate; }

    /* clear thick glass panes */

    .nav-item { font-size: 17px; padding: 13px 18px; gap: 14px; }
    .nav-item .count { font-size: 14px; min-width: 26px; }
    label.f { font-size: 15px; }
    input, select, textarea { font-size: 17px; padding: 13px 18px; }
    .hint { font-size: 14px; }
    .daylabel { font-size: 14px; }
    .dow { font-size: 14px; }
    .cal-head h2 { font-size: 28px; }
    .day .n { font-size: 16px; width: 32px; height: 32px; }
    .chip { font-size: 14px; padding: 4px 8px; }
    .more { font-size: 14px; }
    .drow .k { font-size: 14px; }
    .drow .v { font-size: 17px; }
    .kv { font-size: 16px; grid-template-columns: 150px 1fr; }
    .action { font-size: 14px; }
    .round { width: 52px; height: 52px; }
    .modal h2 { font-size: 24px; }
    #toast { font-size: 16px; padding: 14px 22px; }
    .side { width: 290px; padding: 26px 18px; gap: 26px; }
    .tab { font-size: 13px; }
    .tab svg.i { width: 22px; height: 22px; }
    @media (max-width: 860px) {
      h1 { font-size: 30px; }
      .card { padding: 20px; }
      main { padding-top: 18px; }
    }

    /* wordmark: big name, CRM in its own glass pill */
    .brand { align-items: center; }
    .brand b { font-size: 20px !important; letter-spacing: .03em !important; line-height: 1.05 !important; }
    .brand small { display: inline-flex; align-items: center; margin-top: 7px; padding: 3px 12px; border-radius: 999px;
      font-size: 14px !important; font-weight: 800; letter-spacing: .16em !important; color: #0d4370 !important;
      background: linear-gradient(180deg, rgba(190,228,255,.55), rgba(110,186,246,.45)); border: 1px solid rgba(255,255,255,.85);
      box-shadow: inset 0 1.5px 0 rgba(255,255,255,.95), inset 0 -3px 6px rgba(215,240,255,.6), 0 4px 10px rgba(96,178,245,.35); }
    .brand img { height: 70px !important; }
    .mobile-head .brand img { height: 56px !important; }
    .mobile-head .brand b { font-size: 18px !important; }
    .mobile-head .brand small { font-size: 13px !important; margin-top: 5px; }

    .cols { grid-template-columns: 1.2fr 1fr; }
    @media (max-width: 1000px) { .cols { grid-template-columns: 1fr; } }
    @media (max-width: 860px) { .hide-phone { display: none !important; } }
  </style>
</head>
<body>
  <div id="busy"></div>
  <div class="shell">
    <aside class="side glass">
      <div class="brand" onclick="go('home')"><img src="https://cowboy-mechanics.com/logo-mark.png" alt=""><div><b>Cowboy<br>Mechanics</b><small>CRM</small></div></div>
      <button class="btn primary big" onclick="openLogCall()"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Log a call</button>
      <nav id="sidenav"></nav>
    </aside>
    <main id="app"><p class="muted">Loading...</p></main>
  </div>
  <nav class="tabbar glass" id="tabbar"></nav>
  <div id="modal"></div>
  <div id="toast" role="status"></div>

<script>
  /* ------------------------------------------------------------ state */
  let DATA = { clients: [], calls: [], appointments: [], visits: [], history: [], marketing: [], outbox: [] };
  let SETTINGS = null;
  const UI = { view: 'home', clientId: null, search: '', month: '', selDay: '', showDone: false };
  const PHOTOS = {};
  const DAY = 864e5;
  const SOURCES = ['Phone call', 'Website form', 'Referral', 'Google', 'Facebook', 'Instagram', 'Nextdoor', 'Yelp', 'Walk-up'];
  const REASONS = ['Diagnostics', 'Brakes', 'Oil change', 'Cooling & A/C', 'Electrical', 'Battery & starting', 'Engine', 'Suspension & steering', 'Inspection'];
  const SOURCE_TAG = { 'Missed call': ['Missed call', 'peach'], 'Text': ['Text', 'lav'], 'Website': ['Website', 'mint'], 'Call': ['Call', 'blue'] };

  const ICONS = {
    home: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
    calendar: 'M7 3v4M17 3v4M3 9h18M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z',
    users: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
    settings: 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6',
    phone: 'M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z',
    plus: 'M12 5v14M5 12h14',
    message: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z',
    mail: 'M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM22 6l-10 7L2 6',
    pin: 'M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0zM12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
    camera: 'M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
    wrench: 'M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z',
    check: 'M20 6 9 17l-5-5',
    left: 'M15 18l-6-6 6-6', right: 'M9 18l6-6-6-6',
    megaphone: 'M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1zM16 8a5 5 0 0 1 0 8M19 5a9 9 0 0 1 0 14',
    globe: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20',
    clock: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2',
    car: 'M5 17h14M5 17a2 2 0 1 1-4 0v-4l2-5h18l2 5v4a2 2 0 1 1-4 0M5 17a2 2 0 1 0 4 0M15 17a2 2 0 1 0 4 0',
    note: 'M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5',
    tag: 'M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8zM7.5 7.5h.01',
    list: 'M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01'
  };
  const icon = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`;

  /* ----------------------------------------------------- server calls */
  function call(fn, ...args) {
    document.getElementById('busy').style.display = 'block';
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(r => { document.getElementById('busy').style.display = 'none'; resolve(r); })
        .withFailureHandler(e => { document.getElementById('busy').style.display = 'none'; toast(e.message || String(e), true); reject(e); })[fn](...args);
    });
  }
  async function act(fn, ...args) {
    const d = await call(fn, ...args);
    setData(d);
    return d;
  }
  function setData(d) {
    ['clients', 'calls', 'appointments', 'visits', 'history', 'marketing', 'outbox'].forEach(k => { DATA[k] = d[k] || []; });
    render();
  }

  /* ---------------------------------------------------------- helpers */
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => '$' + (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  const toDate = s => { if (!s) return null; s = String(s); return new Date(s.length === 10 ? s + 'T00:00' : s); };
  const pad = n => String(n).padStart(2, '0');
  const localStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const nowStr = () => localStr(new Date());
  const todayStr = () => nowStr().slice(0, 10);
  const dayKey = d => localStr(d).slice(0, 10);
  const fmtDate = s => { const d = toDate(s); return d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : ''; };
  const fmtShort = s => { const d = toDate(s); return d ? d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : ''; };
  const fmtTime = s => { const d = toDate(s); return d ? d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : ''; };
  const fmtDT = s => s ? fmtShort(s) + ', ' + fmtTime(s) : '';
  const isDay = s => /^\d{4}-\d{2}-\d{2}/.test(String(s || ''));
  const askedFor = s => !s ? '' : isDay(s) ? fmtShort(String(s).slice(0, 10)) : String(s);
  const waited = s => { const h = Math.max(0, Math.round((Date.now() - toDate(s)) / 36e5)); return h < 1 ? 'Just now' : h < 24 ? h + (h === 1 ? ' hour' : ' hours') + ' ago' : Math.floor(h / 24) + (h < 48 ? ' day' : ' days') + ' ago'; };
  const hoursSince = s => (Date.now() - toDate(s)) / 36e5;
  const fullName = c => c ? ([c.firstName, c.lastName].filter(Boolean).join(' ') || 'Unnamed client') : '';
  const client = id => DATA.clients.find(c => c.id === id);
  const vehicles = c => String(c && c.vehicles || '').split('\n').map(v => v.trim()).filter(Boolean);
  const telLink = p => String(p || '').replace(/[^\d+]/g, '');
  const phone = p => { const d = String(p || '').replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '');
    return d.length === 10 ? `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}` : String(p || ''); };
  // Opens the phone's Messages app with the text filled in. "?&body=" works on both iPhone and Android.
  const smsLink = (p, body) => `sms:${telLink(p)}?&body=${encodeURIComponent(body || '')}`;
  const mapLink = a => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a);
  const tag = (text, color) => `<span class="tag ${color}">${esc(text)}</span>`;
  const visitsOf = id => DATA.visits.filter(v => v.clientId === id).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const lastContacted = id => DATA.history.filter(h => h.clientId === id).map(h => String(h.date)).sort().pop() || '';
  const pendingTexts = () => DATA.outbox.filter(t => t.status === 'Pending' && (!t.expires || t.expires > nowStr()));
  const callName = k => k.name || fullName(client(k.clientId)) || phone(k.phone) || 'Unknown caller';

  function toast(msg, err) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = err ? 'err' : '';
    t.style.display = 'block';
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { t.style.display = 'none'; }, err ? 6000 : 2800);
  }

  function go(view, clientId) {
    UI.view = view;
    if (clientId !== undefined) UI.clientId = clientId;
    if (view === 'settings' && !SETTINGS) loadSettings();
    if (view === 'client' && !PHOTOS[UI.clientId]) loadPhotos(UI.clientId);
    render();
    window.scrollTo(0, 0);
  }

  const NAV = [['home', 'Home', 'home'], ['calendar', 'Calendar', 'calendar'], ['clients', 'Clients', 'users'], ['settings', 'Settings', 'settings']];
  function render() {
    const todoCount = todoItems().length;
    const active = UI.view === 'client' ? 'clients' : UI.view;
    document.getElementById('sidenav').innerHTML = NAV.map(([v, label, ic]) =>
      `<button class="nav-item ${active === v ? 'on' : ''}" onclick="go('${v}')">${icon(ic)}${label}${v === 'home' && todoCount ? `<span class="count">${todoCount}</span>` : ''}</button>`).join('');
    const tab = ([v, label, ic]) => `<button class="tab ${active === v ? 'on' : ''}" onclick="go('${v}')">${icon(ic)}${label}${v === 'home' && todoCount ? '<span class="dot"></span>' : ''}</button>`;
    document.getElementById('tabbar').innerHTML = tab(NAV[0]) + tab(NAV[1]) +
      `<button class="tab plus" onclick="openLogCall()" aria-label="Log a call">${icon('plus')}</button>` + tab(NAV[2]) + tab(NAV[3]);
    const views = { home: viewHome, calendar: viewCalendar, clients: viewClients, client: viewClient, settings: viewSettings };
    document.getElementById('app').innerHTML = `<div class="mobile-head"><div class="brand" onclick="go('home')"><img src="https://cowboy-mechanics.com/logo-mark.png" alt=""><div><b>Cowboy Mechanics</b><small>CRM</small></div></div></div>` + (views[UI.view] || viewHome)();
  }

  /* ------------------------------------------------------------- home */
  // Everything Russell still has to get back to. Each item has a checkbox.
  function todoItems() {
    const items = [], today = todayStr(), now = nowStr();
    DATA.calls.filter(k => k.status === 'Open').forEach(k => {
      const [label, color] = SOURCE_TAG[k.source] || [k.source || 'Call', 'blue'];
      const urgent = /^EMERGENCY/.test(k.reason || '');
      const late = urgent || hoursSince(k.created) >= 3;
      const name = callName(k);
      items.push({ late, sort: (urgent ? '0' : '1') + k.created, check: `checkCall('${esc(k.id)}', this)`,
        title: (k.source === 'Missed call' ? 'Missed call from ' : k.source === 'Text' ? 'Text from ' : k.source === 'Website' ? 'Website request from ' : 'Call back ') + name,
        tags: tag(label, color) + (urgent ? tag('Emergency', 'red') : '') + (k.requestedDay ? tag('Asked for ' + askedFor(k.requestedDay), 'pink') : ''),
        sub: [k.vehicle, k.reason].filter(Boolean).join(': '),
        meta: waited(k.created) + (name !== phone(k.phone) && k.phone ? ' · ' + phone(k.phone) : ''),
        acts: (telLink(k.phone) ? `<a class="btn sm" href="tel:${esc(telLink(k.phone))}">${icon('phone')}Call</a><a class="btn sm" href="${esc(smsLink(k.phone, ''))}">${icon('message')}Text</a>` : '') +
          `<button class="btn sm primary" onclick="bookFromCall('${esc(k.id)}')">${icon('calendar')}Book</button>` });
    });
    pendingTexts().forEach(t => {
      const c = client(t.clientId);
      items.push({ late: false, sort: '2' + t.created, check: `checkText('${esc(t.id)}', this)`,
        title: (t.kind === 'thankYou' ? 'Send thank-you text to ' : 'Send reminder text to ') + fullName(c),
        tags: tag(t.kind === 'thankYou' ? 'Thank-you' : 'Reminder', 'pink'), sub: t.body, meta: 'Ready to send · ' + phone(t.phone),
        acts: `<a class="btn sm primary" href="${esc(smsLink(t.phone, t.body))}" onclick="sentText('${esc(t.id)}')">${icon('message')}Send text</a><button class="btn sm" onclick="skipText('${esc(t.id)}')">Skip</button>` });
    });
    DATA.visits.filter(v => v.followUpOn && !v.followUpDone && String(v.followUpOn).slice(0, 10) <= today).forEach(v => {
      const c = client(v.clientId), day = String(v.followUpOn).slice(0, 10);
      items.push({ late: day < today, sort: '1' + v.followUpOn, check: `checkFollowUp('${esc(v.id)}', this)`,
        title: 'Follow up with ' + fullName(c), tags: tag('Follow-up', 'pink') + (day < today ? tag('Was due ' + fmtShort(day), 'red') : tag('Due today', 'peach')),
        sub: v.followUpNote || ('After: ' + [v.reason, v.work].filter(Boolean).join(', ')), meta: c ? phone(c.phone) : '',
        acts: c && telLink(c.phone) ? `<a class="btn sm" href="tel:${esc(telLink(c.phone))}">${icon('phone')}Call</a><a class="btn sm" href="${esc(smsLink(c.phone, ''))}">${icon('message')}Text</a><button class="btn sm" onclick="go('client','${esc(c.id)}')">Open</button>` : '' });
    });
    DATA.appointments.filter(a => a.status === 'Scheduled' && a.end && a.end < now).forEach(a => {
      const c = client(a.clientId);
      items.push({ late: true, sort: '1' + a.start, check: `logJobFor('${esc(a.id)}')`,
        title: 'Log the job for ' + fullName(c), tags: tag('Appointment', 'blue'),
        sub: 'Was ' + fmtDT(a.start) + (a.reason ? ', ' + a.reason : '') + '. Check it off to add what you did and what you charged.', meta: '', acts: '' });
    });
    return items.sort((a, b) => (b.late - a.late) || a.sort.localeCompare(b.sort));
  }

  function todoHtml(t) {
    return `<div class="titem ${t.late ? 'overdue' : ''}"><button class="check" aria-label="Check off" onclick="${t.check}">${icon('check')}</button>
      <div class="grow"><div class="row"><span class="tt">${esc(t.title)}</span>${t.tags}</div>
        ${t.sub ? `<div class="pre small">${esc(t.sub)}</div>` : ''}${t.meta ? `<div class="small muted">${esc(t.meta)}</div>` : ''}
        ${t.acts ? `<div class="acts">${t.acts}</div>` : ''}</div></div>`;
  }

  function viewHome() {
    const items = todoItems(), today = todayStr();
    const sched = a => a.status === 'Scheduled' || a.status === 'Completed';
    const todays = DATA.appointments.filter(a => sched(a) && String(a.start).slice(0, 10) === today).sort((a, b) => a.start.localeCompare(b.start));
    const weekEnd = dayKey(new Date(Date.now() + 7 * DAY));
    const next = DATA.appointments.filter(a => a.status === 'Scheduled' && String(a.start).slice(0, 10) > today && String(a.start).slice(0, 10) <= weekEnd)
      .sort((a, b) => a.start.localeCompare(b.start));
    const byDay = {};
    next.forEach(a => { const k = String(a.start).slice(0, 10); (byDay[k] = byDay[k] || []).push(a); });
    const recent = DATA.history.filter(h => h.type === 'Website form').sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, 3);
    const mk = DATA.marketing.slice().sort((a, b) => String(a.created).localeCompare(String(b.created)));
    const mkOpen = mk.filter(m => !m.done), mkDone = mk.filter(m => m.done);
    const hour = new Date().getHours();

    return `
      <div class="top"><div><h1>Good ${hour < 12 ? 'morning' : hour < 17 ? 'afternoon' : 'evening'}, Russell</h1>
        <div class="muted">${esc(new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }))}</div></div>
        <div class="row"><button class="btn" onclick="refresh()">Check for new</button><button class="btn" onclick="editAppointment()">${icon('calendar')}Book</button>
          <button class="btn primary hide-phone" onclick="openLogCall()">${icon('plus')}Log a call</button></div></div>

      <div class="cols home-cols">
        <div class="stack">
          <section class="card glass o1"><div class="card-head"><div class="left"><span class="badge-icon tag peach">${icon('phone')}</span>
            <div><h2>To do</h2><div class="small muted">Calls, texts and follow-ups to get back to</div></div></div>${items.length ? tag(items.length + ' left', items.some(i => i.late) ? 'red' : 'gray') : ''}</div>
            <div class="todo">${items.length ? items.map(todoHtml).join('') : '<div class="empty">All caught up. Nice work.</div>'}</div></section>

          <section class="card glass o5"><div class="card-head"><div class="left"><span class="badge-icon tag lav">${icon('megaphone')}</span><h2>Marketing to do</h2></div>
            ${mkDone.length ? `<button class="linkbtn small" onclick="UI.showDone=!UI.showDone; render()">${UI.showDone ? 'Hide' : 'Show'} done (${mkDone.length})</button>` : ''}</div>
            <form class="row" onsubmit="event.preventDefault(); addMarketing(this)" style="flex-wrap:nowrap"><input id="mkText" name="text" placeholder="Add something, like: post a before/after photo" aria-label="New marketing item"><button class="btn" aria-label="Add">${icon('plus')}</button></form>
            <div style="margin-top:8px">${mkOpen.map(mkHtml).join('')}${UI.showDone ? mkDone.map(mkHtml).join('') : ''}
              ${!mkOpen.length && !(UI.showDone && mkDone.length) ? '<div class="empty">Nothing on the list yet.</div>' : ''}</div></section>
        </div>

        <div class="stack">
          <section class="card glass o2"><div class="card-head"><div class="left"><span class="badge-icon tag blue">${icon('clock')}</span><h2>Today's appointments</h2></div>${tag(todays.length, 'blue')}</div>
            <div class="list">${todays.length ? todays.map(a => apptRow(a)).join('') : '<div class="empty">No appointments today.</div>'}</div></section>

          <section class="card glass o3"><div class="card-head"><div class="left"><span class="badge-icon tag mint">${icon('calendar')}</span><h2>Next 7 days</h2></div>
            <button class="linkbtn small" onclick="go('calendar')">Calendar</button></div>
            <div class="list">${Object.keys(byDay).length ? Object.keys(byDay).map(k => `<div class="daylabel">${esc(fmtShort(k))}</div>${byDay[k].map(a => apptRow(a)).join('')}`).join('') : '<div class="empty">Nothing booked yet.</div>'}</div></section>

          <section class="card glass o4"><div class="card-head"><div class="left"><span class="badge-icon tag pink">${icon('globe')}</span><h2>Recent website requests</h2></div></div>
            <div class="list">${recent.length ? recent.map(h => { const c = client(h.clientId); return `<button class="appt" onclick="go('client','${esc(h.clientId)}')">
              <div class="grow"><div class="row spread"><b>${esc(fullName(c))}</b><span class="small muted">${esc(fmtShort(h.date))}</span></div>
              <div class="small muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(h.summary)}</div></div></button>`; }).join('') : '<div class="empty">No website requests yet.</div>'}</div></section>
        </div>
      </div>`;
  }

  function apptRow(a, withDate) {
    const c = client(a.clientId);
    return `<button class="appt" onclick="showAppointment('${esc(a.id)}')"><span class="time">${withDate ? `<span class="small muted" style="display:block;font-weight:600">${esc(fmtShort(a.start))}</span>` : ''}${esc(fmtTime(a.start))}</span>
      <div class="grow"><div class="row"><b>${esc(fullName(c))}</b>${a.status === 'Completed' ? tag('Done', 'mint') : ''}</div>
      <div class="small muted">${esc([a.reason, a.vehicle].filter(Boolean).join(' · ') || 'Appointment')}</div></div>${icon('right')}</button>`;
  }

  function mkHtml(m) {

    const [y, m] = UI.month.split('-').map(Number);
    const first = new Date(y, m - 1, 1);
    const start = new Date(y, m - 1, 1 - first.getDay());
    const byDay = {};
    DATA.appointments.filter(a => a.status !== 'Cancelled').forEach(a => { const k = String(a.start).slice(0, 10); (byDay[k] = byDay[k] || []).push(a); });
    Object.values(byDay).forEach(l => l.sort((a, b) => a.start.localeCompare(b.start)));
    const cells = [];
    for (let i = 0; i < 42; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      if (i === 35 && d.getMonth() !== m - 1) break;
      const k = dayKey(d), list = byDay[k] || [];

  // Shrinks a photo in the browser so uploads are fast on a phone connection.
  function shrink(file, max, quality) {
    return new Promise((resolve, reject) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Could not read that photo'));
      img.src = url;
    });
  }

  async function uploadPhotos(clientId, input) {
    const files = Array.from(input.files || []);
    input.value = '';
    for (let i = 0; i < files.length; i++) {
      toast(`Uploading photo ${i + 1} of ${files.length}...`);
      try {
        const full = await shrink(files[i], 1600, 0.85), thumb = await shrink(files[i], 260, 0.7);
        PHOTOS[clientId] = await call('uploadPhoto', clientId, full, files[i].name.replace(/\.\w+$/, '') + '.jpg', thumb, '');
        render();
      } catch (e) { toast(e.message || 'Upload failed', true); return; }
    }
    if (files.length) toast(files.length === 1 ? 'Photo saved' : files.length + ' photos saved');
  }

      if (f.type === 'textarea') return `<textarea id="${id}" name="${f.k}" placeholder="${esc(f.placeholder || '')}">${esc(val)}</textarea>`;
      if (f.type === 'select') return `<select id="${id}" name="${f.k}">${f.options.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o];
        return `<option value="${esc(ov)}" ${String(val) === String(ov) ? 'selected' : ''}>${esc(ol)}</option>`; }).join('')}</select>`;
      if (f.type === 'checkbox') return `<span class="pillcheck"><input type="checkbox" id="${id}" name="${f.k}" ${val === true ? 'checked' : ''}> ${esc(f.text || '')}</span>`;
      return `<input id="${id}" name="${f.k}" type="${f.type || 'text'}" value="${esc(val)}" placeholder="${esc(f.placeholder || '')}" ${f.type === 'number' ? 'step="any" inputmode="decimal"' : ''} ${f.list ? `list="dl-${f.k}"` : ''}>
        ${f.list ? `<datalist id="dl-${f.k}">${f.list.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : ''}`;
    };
    const fieldHtml = f => f.section ? `<div class="section-title" ${f.group ? `data-group="${f.group}"` : ''}>${f.section}</div>` :
      `<label class="f ${f.full || f.type === 'textarea' ? 'full' : ''}" for="f-${f.k}" ${f.group ? `data-group="${f.group}"` : ''}>
        ${f.type === 'checkbox' ? '' : esc(f.label) + (f.req ? ' <span class="req">*</span>' : '')}${input(f)}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ''}</label>`;
    openModal(`<form id="mform"><h2>${esc(title)}</h2><div class="form">${fields.map(fieldHtml).join('')}</div>
      <div class="actions">${extra || ''}<span class="grow"></span><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`);
    document.getElementById('mform').onsubmit = async e => {
      e.preventDefault();
      const out = Object.assign({}, v);
      e.target.querySelectorAll('[name]').forEach(el => { out[el.name] = el.type === 'checkbox' ? el.checked : el.value.trim(); });
      const visible = f => { const el = document.querySelector(`#mform [for="f-${f.k}"]`); return el && el.style.display !== 'none'; };
      const missing = fields.find(f => f.req && visible(f) && !String(out[f.k] || '').trim());
      if (missing) { toast('Add their ' + missing.label.toLowerCase(), true); document.getElementById('f-' + missing.k).focus(); return; }
      try { await onSave(out); closeModal(); } catch (err) { /* toast already shown */ }
    };
    const first = document.querySelector('#mform input:not([type=checkbox]), #mform select, #mform textarea');
    if (first) first.focus();
  }

  const clientOptions = () => DATA.clients.slice().sort((a, b) => fullName(a).localeCompare(fullName(b))).map(c => [c.id, fullName(c) + (c.phone ? ', ' + phone(c.phone) : '')]);
  const visitFields = (prefix, group) => [
    { k: prefix + 'date', label: 'Date', type: 'date', group }, { k: prefix + 'charged', label: 'Charged ($)', type: 'number', group },
    { k: prefix + 'reason', label: 'Reason', list: REASONS, full: true, group, placeholder: 'What they called about' },
    { k: prefix + 'work', label: 'Services done', type: 'textarea', group },
    { k: prefix + 'products', label: 'Products used', type: 'textarea', group, placeholder: 'Parts, oil, fluids, brands' }];

  function editClient(id) {
    const c = id ? client(id) : { okText: true, okEmail: true };
    const fields = [
      { k: 'firstName', label: 'First name', req: true }, { k: 'lastName', label: 'Last name' },
      { k: 'phone', label: 'Phone number', type: 'tel', req: true }, { k: 'email', label: 'Email', type: 'email' },
      { k: 'address', label: 'Address', full: true },
      { k: 'vehicles', label: 'Vehicles', type: 'textarea', placeholder: 'One per line, like: 2019 Ford Fiesta ST' },
      { k: 'source', label: 'How they found you', list: SOURCES, full: true },
      { k: 'notes', label: 'Notes', type: 'textarea' },
      { k: 'okText', type: 'checkbox', text: 'OK to text them' }, { k: 'okEmail', type: 'checkbox', text: 'OK to email them' }];
    // A new client can have their first job filled in on the same form.
    if (!id) fields.push({ section: icon('wrench') + ' Job (optional)' }, ...visitFields('v_', ''), { k: 'v_notes', label: 'Job notes', type: 'textarea' });
    openForm(id ? 'Edit client' : 'Add a client', fields, Object.assign({ v_date: todayStr() }, c), async out => {
      const job = {};
      Object.keys(out).filter(k => k.startsWith('v_')).forEach(k => { job[k.slice(2)] = out[k]; delete out[k]; });
      const d = await act('saveClient', out);
      if (!id && ['reason', 'work', 'products', 'charged', 'notes'].some(k => job[k])) {
        job.clientId = d.savedId; job.vehicle = vehicles(out)[0] || '';
        await act('saveVisit', job, '');
      }
      if (!id) go('client', d.savedId);
      toast('Client saved');
    }, id ? '' : '');
  }

  // Opened by the Log a call button, or by MacroDroid's shortcut with ?log=1&phone=...
  function openLogCall(phoneNumber) {
    const p = phoneNumber || '';
    const known = DATA.clients.find(c => p && String(c.phone).replace(/\D/g, '').slice(-10) === String(p).replace(/\D/g, '').slice(-10));
    openForm('Log a call', [
      { k: 'phone', label: 'Phone number', type: 'tel', req: true, full: true, hint: known ? 'This is ' + fullName(known) + ', already in your clients.' : '' },
      { k: 'name', label: 'Name' }, { k: 'vehicle', label: 'Vehicle', placeholder: 'Year, make, model' },
      { k: 'reason', label: 'What do they need?', type: 'textarea', placeholder: 'Tap the mic on your keyboard to talk instead of typing' },
      { k: 'requestedDay', label: 'Day they asked for', type: 'date', hint: 'Optional' },
      { section: icon('clock') + ' Remind me' },
      { k: 'remind1h', type: 'checkbox', text: 'In 1 hour' }, { k: 'remind3h', type: 'checkbox', text: 'In 3 hours' },
      { k: 'remindHourly', type: 'checkbox', text: 'Every hour until I check it off', full: true }
    ], { phone: p, name: known ? fullName(known) : '', vehicle: known ? vehicles(known)[0] || '' : '', remind1h: true, source: 'Call' }, async out => {
      await act('logCall', out);
      const r = [out.remind1h && 'in 1 hour', out.remind3h && 'in 3 hours', out.remindHourly && 'every hour'].filter(Boolean);
      toast('Saved to your to-do list' + (r.length ? '. Reminding you ' + r.join(', ') + '.' : '.'));
    });
  }

  function bookFromCall(callId) {
    const k = DATA.calls.find(x => x.id === callId);
    const parts = String(k.name || '').trim().split(/\s+/);
    editAppointment(null, k.clientId || null, { callId, day: isDay(k.requestedDay) ? String(k.requestedDay).slice(0, 10) : '', reason: k.reason || '', vehicle: k.vehicle || '',
      ncFirst: k.clientId ? '' : parts.shift() || '', ncLast: k.clientId ? '' : parts.join(' '), ncPhone: k.clientId ? '' : k.phone });
  }

  function editAppointment(id, clientId, preset) {
    const p = preset || {};
    let a;
    if (id) a = DATA.appointments.find(x => x.id === id);
    else {
      const t = p.day ? toDate(p.day) : new Date(Date.now() + DAY);
      t.setHours(9, 0, 0, 0);
      const c = client(clientId);
      a = Object.assign({ clientId: clientId || 'new', start: localStr(t), status: 'Scheduled', location: c ? c.address : '', vehicle: c ? vehicles(c)[0] || '' : '' }, p);
    }
    const c = client(a.clientId);
    const vals = Object.assign({}, a, { length: a.end ? String((toDate(a.end) - toDate(a.start)) / 36e5) : '2' });
    openForm(id ? 'Edit appointment' : 'Book appointment', [
      { k: 'clientId', label: 'Client', type: 'select', full: true, options: [...(id ? [] : [['new', 'New client (fill in below)']]), ...clientOptions()] },
      { k: 'ncFirst', label: 'First name', group: 'new', req: true }, { k: 'ncLast', label: 'Last name', group: 'new' },
      { k: 'ncPhone', label: 'Phone number', type: 'tel', group: 'new', req: true }, { k: 'ncEmail', label: 'Email', type: 'email', group: 'new' },
      { k: 'ncAddress', label: 'Address', full: true, group: 'new', hint: 'They are added to your clients. If the phone number is already there, it books under that client.' },
      { k: 'start', label: 'Date and time', type: 'datetime-local', req: true }, { k: 'length', label: 'How long (hours)', type: 'number' },
      { k: 'reason', label: 'Reason', list: REASONS }, { k: 'vehicle', label: 'Vehicle', list: c ? vehicles(c) : [] },
      { k: 'location', label: 'Location', full: true, hint: 'Leave blank to use their address' },
      { k: 'notes', label: 'Notes', type: 'textarea' },
      ...(id ? [{ k: 'status', label: 'Status', type: 'select', options: ['Scheduled', 'Completed', 'Cancelled', 'No-show'] }] : [])
    ], vals, async out => {
      if (out.clientId === 'new') {
        out.newClient = { firstName: out.ncFirst, lastName: out.ncLast, phone: out.ncPhone, email: out.ncEmail, address: out.ncAddress, vehicles: out.vehicle, source: 'Phone call' };
        if (!out.location) out.location = out.ncAddress;
        out.clientId = '';
      }
      out.end = localStr(new Date(toDate(out.start).getTime() + (Number(out.length) || 2) * 36e5));
      ['ncFirst', 'ncLast', 'ncPhone', 'ncEmail', 'ncAddress', 'length', 'day'].forEach(k => delete out[k]);
      const d = await act('saveAppointment', out);
      const b = d.booked;
      toast(out.status === 'Cancelled' ? 'Cancelled and taken off your Google Calendar'
        : b ? (b.existing ? b.name + ' was already in your clients. Booked and added to your calendar.' : b.name + ' added to your clients and calendar')
        : 'Saved to your Google Calendar');
    }, id ? `<button type="button" class="btn danger" onclick="delAppointment('${esc(id)}')">Delete</button>` : '');
    const sel = document.getElementById('f-clientId');
    const sync = () => document.querySelectorAll('#mform [data-group="new"]').forEach(el => { el.style.display = sel.value === 'new' ? '' : 'none'; });
    sel.addEventListener('change', sync);
    sync();
  }

  function logJobFor(apptId) {
    const a = DATA.appointments.find(x => x.id === apptId);
    editVisit(null, a.clientId, { date: String(a.start).slice(0, 10), vehicle: a.vehicle || '', reason: a.reason || '' }, apptId);
  }

  function editVisit(id, clientId, preset, apptId) {
    const v = id ? DATA.visits.find(x => x.id === id) : Object.assign({ clientId: clientId || '', date: todayStr() }, preset || {});
    const c = client(v.clientId);
    openForm(id ? 'Edit job' : 'Log a job' + (c ? ' for ' + fullName(c) : ''), [
      ...(c ? [] : [{ k: 'clientId', label: 'Client', type: 'select', full: true, options: [['', 'Pick a client'], ...clientOptions()], req: true }]),
      { k: 'vehicle', label: 'Vehicle', list: c ? vehicles(c) : [], full: true },
      ...visitFields('', ''),
      { k: 'notes', label: 'Notes', type: 'textarea' },
      { section: icon('clock') + ' Follow up (optional)' },
      { k: 'followUpOn', label: 'Remind me to follow up on', type: 'date', hint: 'It shows up on your to-do list that day' },
      { k: 'followUpNote', label: 'About what', placeholder: 'Check the brakes again, oil change due' }
    ], Object.assign({}, v, { date: String(v.date || '').slice(0, 10), followUpOn: String(v.followUpOn || '').slice(0, 10) }), async out => {
      await act('saveVisit', out, apptId || '');
      toast(apptId ? 'Job saved and appointment marked done' : 'Job saved');
    }, id ? `<button type="button" class="btn danger" onclick="delVisit('${esc(id)}')">Delete</button>` : '');
  }

  function addNote(clientId) {
    openForm('Add a note', [
      { k: 'type', label: 'Type', type: 'select', options: ['Note', 'Call', 'Text', 'Text conversation', 'Email', 'In person'] },
      { k: 'date', label: 'When', type: 'datetime-local' },
      { k: 'summary', label: 'What happened', type: 'textarea', req: true, hint: 'You can paste a whole text conversation here.' }
    ], { clientId, type: 'Note', date: nowStr() }, async out => { await act('saveNote', out); toast('Note saved'); });
  }

  function compose(clientId) {
    const c = client(clientId);
    openForm('Email ' + fullName(c), [
      { k: 'subject', label: 'Subject', full: true }, { k: 'body', label: 'Message', type: 'textarea', req: true }
    ], { subject: 'Cowboy Mechanics', body: `Hi ${c.firstName || 'there'},\n\n` }, async out => {
      await act('sendMessage', clientId, 'email', out.subject, out.body);
      toast('Email sent');
    });
  }

  /* ----------------------------------------------------------- deletes */
  async function delClient(id) {
    if (!confirm('Delete this client and all their jobs, photos, appointments and history? This cannot be undone.')) return;
    await act('deleteClient', id); go('clients'); toast('Client deleted');
  }
  async function delVisit(id) { if (!confirm('Delete this job?')) return; await act('deleteVisit', id); closeModal(); toast('Deleted'); }
  async function delAppointment(id) { if (!confirm('Delete this appointment? It also comes off your Google Calendar.')) return; await act('deleteAppointment', id); closeModal(); toast('Deleted'); }
  async function delNote(id) { if (!confirm('Delete this entry?')) return; await act('deleteNote', id); }

  async function refresh() {
    const before = DATA.calls.filter(k => k.status === 'Open').length;
    const d = await act('getData', true);
    if (d.syncError) return toast('Could not check everything: ' + d.syncError, true);
    const now = d.calls.filter(k => k.status === 'Open').length;
    toast(now > before ? (now - before) + ' new on your to-do list' : 'Nothing new');
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  // Light on the glass slides with the mouse (computer) or with scrolling (phone).
  (function () {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    let x = 28, queued = false;
    const paint = () => { queued = false; document.documentElement.style.setProperty('--lx', x.toFixed(1)); };
    const move = v => { x = Math.max(8, Math.min(92, v)); if (!queued) { queued = true; requestAnimationFrame(paint); } };
    addEventListener('pointermove', e => { if (e.pointerType === 'mouse') move(e.clientX / innerWidth * 100); }, { passive: true });
    addEventListener('scroll', () => move(20 + (scrollY % 1200) / 1200 * 60), { passive: true });
  })();
  call('getData', true).then(d => {
    setData(d);
    if (d.syncError) toast('Could not check everything: ' + d.syncError, true);
    // MacroDroid's "Log last call" shortcut opens the CRM with ?log=1&phone=<last caller>.
    try {
      google.script.url.getLocation(loc => { const q = loc.parameter || {}; if (q.log) openLogCall(q.phone || ''); });
    } catch (e) { /* no link parameters */ }
  });
  loadSettings();
</script>
</body>
</html>
